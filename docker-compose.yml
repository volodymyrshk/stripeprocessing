services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_sync
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sync_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_sync"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    profiles: [sandbox]
    image: stripe-payment-sync:local
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/payment_sync?schema=public
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CRM_URL: http://mock-crm:3001
      CRM_API_KEY: ${CRM_API_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mock-crm:
        condition: service_started

  mock-crm:
    profiles: [sandbox]
    image: stripe-payment-sync:local
    build: .
    command: [node, dist/mock-crm/server.js]
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      CRM_API_KEY: ${CRM_API_KEY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  sync_postgres:
