name: Verify payment sync
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_sync_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run prisma:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payment_sync_test
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payment_sync_test
      - run: npm run demo
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/payment_sync_test
      - uses: actions/upload-artifact@v4
        with:
          name: recovery-demo-evidence
          path: artifacts/demo.json
      - run: docker build -t stripe-payment-sync:local .
